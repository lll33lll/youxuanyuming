name: 自检（用完即删）

# 推送本文件即自动触发：验证改频率后的 workflow 正常
on:
  push:
    paths:
      - '.github/workflows/selftest.yml'

permissions:
  actions: write

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 触发正式 update.yml 并等待结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          gh workflow run update.yml --ref main
          echo "已触发 update.yml，等待完成..."
          for i in $(seq 1 30); do
            sleep 10
            run_json=$(gh run list --workflow=update.yml --limit 1 --json databaseId,status,conclusion,createdAt)
            echo "第${i}次查询: $run_json"
            status=$(echo "$run_json" | jq -r '.[0].status')
            if [ "$status" = "completed" ]; then
              conclusion=$(echo "$run_json" | jq -r '.[0].conclusion')
              echo "update.yml 运行结果: $conclusion"
              [ "$conclusion" = "success" ] && exit 0
              exit 1
            fi
          done
          echo "等待超时（5分钟）"
          exit 1
