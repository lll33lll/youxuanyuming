name: 自检（用完即删）

# 推送本文件即自动触发：分别以 proxy 和 all 范围各跑一次正式流程，验证分节奏逻辑
on:
  push:
    paths:
      - '.github/workflows/selftest.yml'

permissions:
  actions: write

jobs:
  trigger-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 依次验证 proxy / all 两个范围
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          run_and_wait() {
            scope="$1"
            prev_id=$(gh run list --workflow=update.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ "$scope" = "all" ]; then
              gh workflow run update.yml --ref main
            else
              gh workflow run update.yml --ref main -f scope="$scope"
            fi
            echo "[$scope] 已触发，等待新 run 出现并完成..."
            for i in $(seq 1 36); do
              sleep 10
              cur=$(gh run list --workflow=update.yml --limit 1 --json databaseId,status,conclusion --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion)"')
              id=$(echo "$cur" | awk '{print $1}')
              status=$(echo "$cur" | awk '{print $2}')
              conclusion=$(echo "$cur" | awk '{print $3}')
              if [ "$id" != "$prev_id" ] && [ "$status" = "completed" ]; then
                echo "[$scope] 运行结果: $conclusion"
                [ "$conclusion" = "success" ] && return 0
                return 1
              fi
            done
            echo "[$scope] 等待超时"
            return 1
          }
          run_and_wait proxy || exit 1
          run_and_wait all || exit 1
          echo "两个范围均验证通过"
