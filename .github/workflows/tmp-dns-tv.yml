name: tmp-dns-tv
# One-shot: create DNS record tv.223226.xyz -> 154.217.255.220 (DNS only)
# Temporary workflow for MoonTVPlus domain binding. Safe to delete this file/branch after use.
on:
  push:
    branches: [ dns-tv-oneshot ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add-record:
    runs-on: ubuntu-latest
    steps:
      - name: Create A record
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ]; then echo "CF_API_TOKEN missing"; exit 1; fi
          ZID=$(curl -sf "https://api.cloudflare.com/client/v4/zones?name=223226.xyz" -H "Authorization: Bearer ${CF_API_TOKEN}" | jq -r '.result[0].id')
          echo "zone=${ZID}"
          N=$(curl -sf "https://api.cloudflare.com/client/v4/zones/${ZID}/dns_records?type=A&name=tv.223226.xyz" -H "Authorization: Bearer ${CF_API_TOKEN}" | jq '.result | length')
          if [ "${N}" != "0" ]; then echo "record already exists (${N}), nothing to do"; exit 0; fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/${ZID}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            --data '{"type":"A","name":"tv.223226.xyz","content":"154.217.255.220","ttl":120,"proxied":false}' \
            | jq '{success, name: .result.name, content: .result.content, id: .result.id}'
