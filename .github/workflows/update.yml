name: 采集优选IP并更新DNS

on:
  schedule:
    # :17 批次 = 官方+反代全量（官方池 cf/cloudflare 每 3 小时换新）
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
    # :47 批次 = 仅反代（反代池 proxy 每 1 小时换新）
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只看计划，不实际改动 DNS'
        required: false
        default: false
        type: boolean
      scope:
        description: '范围'
        required: false
        default: all
        type: choice
        options:
          - all
          - official
          - proxy

# 防止上一次还没跑完下一次又启动
concurrency:
  group: youxuanyuming-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 确定本次范围
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # 定时触发：按触发本任务的 cron 表达式区分（:47 的批次只跑反代）
            case "${{ github.event.schedule }}" in
              47*) SCOPE=proxy ;;
              *)   SCOPE=all ;;
            esac
          else
            SCOPE="${{ inputs.scope }}"
          fi
          [ -z "$SCOPE" ] && SCOPE=all
          echo "本次范围: $SCOPE"
          echo "SCOPE=$SCOPE" >> "$GITHUB_ENV"

      - name: 采集优选IP
        run: python collect_ips.py "$SCOPE"

      - name: 提交 ip.txt / proxy.txt
        run: |
          if [ -n "$(git status --porcelain ip.txt proxy.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ip.txt proxy.txt
            git commit -m "chore: 更新优选IP列表 [$SCOPE] $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "ip.txt / proxy.txt 无变化，跳过提交"
          fi

      - name: 更新 Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_NAME: 223226.xyz
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::未配置 CF_API_TOKEN（仓库 Settings → Secrets and variables → Actions），本次只采集不更新 DNS，配置好后的下个周期自动生效"
            exit 0
          fi
          python bestdomain.py --only "$SCOPE"
