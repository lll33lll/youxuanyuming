name: 采集优选IP并更新DNS

on:
  schedule:
    - cron: '17 */3 * * *'  # 每 3 小时一次（UTC，北京时间 05:17/08:17/11:17...）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只看计划，不实际改动 DNS'
        required: false
        default: false
        type: boolean

# 防止上一次还没跑完下一次又启动
concurrency:
  group: youxuanyuming-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 采集优选IP
        run: python collect_ips.py

      - name: 提交 ip.txt / proxy.txt
        run: |
          if [ -n "$(git status --porcelain ip.txt proxy.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ip.txt proxy.txt
            git commit -m "chore: 更新优选IP列表 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "ip.txt / proxy.txt 无变化，跳过提交"
          fi

      - name: 更新 Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_NAME: 223226.xyz
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::未配置 CF_API_TOKEN（仓库 Settings → Secrets and variables → Actions），本次只采集不更新 DNS，配置好后的下个周期自动生效"
            exit 0
          fi
          python bestdomain.py
