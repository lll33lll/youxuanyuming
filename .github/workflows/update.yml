name: 采集优选IP并更新DNS

on:
  # 【临时】代码文件更新即触发一次运行（加速首轮三网反代批次；验证后移除本段，仅保留 schedule + workflow_dispatch）
  push:
    paths:
      - 'collect_ips.py'
      - 'bestdomain.py'
      - 'retire_cloudflare.py'
  schedule:
    # :17 批次 = 官方+反代全量（官方池 cf 每 3 小时换新）
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
    # :47 批次 = 仅反代（反代池 proxy + 三网反代 ct/cu/cmcc 每 1 小时换新）
    # 【临时】加速触发用（首轮三网反代批次验证后恢复为 '47 * * * *'）
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只看计划，不实际改动 DNS'
        required: false
        default: false
        type: boolean
      scope:
        description: '范围'
        required: false
        default: all
        type: choice
        options:
          - all
          - official
          - proxy

# 防止上一次还没跑完下一次又启动
concurrency:
  group: youxuanyuming-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 确定本次范围
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            # 定时触发：按触发本任务的 cron 表达式区分（:47 的批次只跑反代）
            case "${{ github.event.schedule }}" in
              47*) SCOPE=proxy ;;
              *)   SCOPE=all ;;
            esac
          else
            SCOPE="${{ inputs.scope }}"
          fi
          [ -z "$SCOPE" ] && SCOPE=all
          echo "本次范围: $SCOPE"
          echo "SCOPE=$SCOPE" >> "$GITHUB_ENV"

      - name: 采集优选IP
        run: python collect_ips.py "$SCOPE"

      - name: 提交 ip.txt / proxy.txt / 三网 proxy-*.txt
        run: |
          FILES="ip.txt proxy.txt proxy-ct.txt proxy-cu.txt proxy-cmcc.txt"
          if [ -n "$(git status --porcelain $FILES)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: 更新优选IP列表 [$SCOPE] $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "列表无变化，跳过提交"
          fi

      - name: 更新 Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_NAME: 223226.xyz
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::未配置 CF_API_TOKEN（仓库 Settings → Secrets and variables → Actions），本次只采集不更新 DNS，配置好后的下个周期自动生效"
            exit 0
          fi
          python bestdomain.py --only "$SCOPE"

      - name: 清理已停用子域 cloudflare.223226.xyz（临时步骤，清理完成后移除）
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_NAME: 223226.xyz
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "未配置 CF_API_TOKEN，跳过"
            exit 0
          fi
          python retire_cloudflare.py
